global:
  # Required for pulling images from the private DHI registry
  imagePullSecrets:
    - name: dhi-registry-secret

  # Explicitly set the leader election namespace
  leaderElection:
    namespace: "cert-manager"

# CRD installation
crds:
  enabled: true

# Webhook configuration for Talos host network reachability
webhook:
  hostNetwork: true
  securePort: 10260
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 100m
      memory: 192Mi

# Use a stable, short name for all rendered resources
fullnameOverride: "cert-manager"

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Prometheus Monitoring
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    # Prometheus Operator label (Opt-In)
    labels:
      release: prometheus
